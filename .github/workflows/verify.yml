name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned Engine pair
        run: |
          pin=$(sed -n 's|.*<RustyEnginePackageVersion>\([^<]*\)</RustyEnginePackageVersion>.*|\1|p' Directory.Build.props)
          curl -fsSL https://raw.githubusercontent.com/FuzzySlipper/rusty-engine/46ac695b609fc786acf18f85e7a4b82ee4f070ff/scripts/install-rusty.sh | bash -s -- --version "$pin"
          ~/.local/bin/rusty install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build, typecheck, check domains and stage CoreCLR
        run: bash scripts/check.sh
      - name: Verify clean UI construction through rusty
        run: |
          rm -rf src/ui/generated
          rusty build --project src/Rifles.Game/Rifles.Game.csproj
